<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="R4 vector probe">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0b5fa5"/>
			<stop offset="100%" stop-color="#12b886"/>
		</linearGradient>
		<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
			<line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
		</pattern>
	</defs>
	<rect x="0" y="0" width="400" height="300" fill="url(#bg)"/>
	<rect x="0" y="0" width="400" height="300" fill="url(#hatch)"/>
	<circle cx="120" cy="110" r="70" fill="#ffffff" opacity="0.85"/>
	<circle cx="120" cy="110" r="70" fill="none" stroke="#0b3d66" stroke-width="2"/>
	<rect x="215" y="60" width="150" height="100" rx="14" fill="#ffe066" stroke="#8a6d00" stroke-width="2"/>
	<path d="M20 260 L90 200 L160 240 L230 180 L300 230 L380 170" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
	<text x="20" y="40" fill="#ffffff" font-family="monospace" font-size="20">vector.svg 400x300</text>
	<text x="232" y="118" fill="#4a3800" font-family="monospace" font-size="16">SVG 不失真</text>
</svg>
