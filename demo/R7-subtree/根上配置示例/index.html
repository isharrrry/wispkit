<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<title>根上配置示例</title>
	<style>
		body {
			margin: 0;
			padding: 32px 40px;
			font: 15px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
			color: #1f2328;
		}

		h1 {
			margin: 0 0 12px;
			font-size: 24px;
		}

		code {
			padding: 1px 5px;
			border-radius: 4px;
			background: rgba(175, 184, 193, 0.25);
			font-family: "Cascadia Mono", Consolas, monospace;
		}

		.box {
			margin-top: 16px;
			padding: 16px 18px;
			border: 1px solid #d8dee4;
			border-radius: 8px;
			background: #f6f8fa;
		}

		.ok {
			color: #1a7f37;
			font-weight: 600;
		}
	</style>
</head>

<body>
	<h1>根上配置示例</h1>
	<p>这个文件夹里 <strong>没有</strong> <code>.WispkitView/</code> —— <code>Wispkit.json</code> 直接放在文件夹根上。</p>
	<div class="box">
		<p class="ok">✓ 如果你看到这一页，说明第二种查找位置也生效了。</p>
		<p>查找顺序固定是：先 <code>&lt;文件夹&gt;/.WispkitView/Wispkit.json</code>，找不到才看
			<code>&lt;文件夹&gt;/Wispkit.json</code>。两者同时存在时以 <code>.WispkitView/</code> 里的为准。</p>
		<p>这里的 <code>entry</code> 是 <code>index.html</code>，相对被点击的文件夹解析。</p>
	</div>
</body>

</html>
